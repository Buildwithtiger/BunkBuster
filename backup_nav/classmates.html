<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Classmates — BunkBuster</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <span>🎯 BunkBuster</span>
        <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
    </div>
    <div class="drawer-profile" th:if="${student}">
        <div class="profile-photo-wrap">
            <img th:if="${student.profilePhoto != null}" th:src="${student.profilePhoto}" class="profile-photo">
            <div th:unless="${student.profilePhoto != null}" class="profile-photo default">
                <span th:text="${#strings.substring(student.name, 0, 1)}">R</span>
            </div>
            <form th:action="@{/student/upload-photo}" method="post" enctype="multipart/form-data" class="photo-form">
                <label for="photoInput" class="photo-edit-btn">📷</label>
                <input type="file" id="photoInput" name="photo" accept="image/*" onchange="this.form.submit()" style="display:none;">
            </form>
        </div>
        <div class="profile-name" th:text="${student.name}">Student</div>
        <div class="profile-roll">
            <span th:text="${student.className}">BCA-3</span> · Roll <span th:text="${student.rollNumber}">01</span>
        </div>
    </div>
    <nav class="sidebar-menu">
        <a href="/student/home">🏠 Dashboard</a>
        <a href="/student/subjects">📚 Subjects</a>
        <a href="/student/mark-attendance">✅ Mark Attendance</a>
        <a href="/student/leaderboard">🏆 Leaderboard</a>
        <a href="/student/notices">📢 Notices</a>
        <a href="/student/classmates" class="active">👥 Classmates</a>
        <a href="/student/profile">👤 Profile</a>
        <a href="/auth/logout" style="color:#ff6b6b;">🚪 Logout</a>
    </nav>
</aside>

<main class="main-content">
    <div th:replace="~{common/navbar :: navbar(${student})}"></div>

    <section class="section">
        <h2>👥 My Classmates — <span th:text="${student.className}">BCA-3</span></h2>

        <!-- SEARCH BAR -->
        <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search by name, roll number..." onkeyup="filterClassmates()">
            <span class="search-count" id="searchCount"></span>
        </div>

        <!-- CLASSMATE CARDS -->
        <div class="classmates-grid" id="classmatesGrid">
            <div class="classmate-card" th:each="s : ${students}"
                 th:attr="data-name=${s.name},data-roll=${s.rollNumber}">
                <div class="classmate-photo-wrap">
                    <img th:if="${s.profilePhoto != null}" th:src="${s.profilePhoto}" class="classmate-photo">
                    <div th:unless="${s.profilePhoto != null}" class="classmate-photo default">
                        <span th:text="${#strings.substring(s.name, 0, 1)}">R</span>
                    </div>
                    <span th:if="${s.id == student.id}" class="me-tag">YOU</span>
                </div>
                <div class="classmate-name" th:text="${s.name}">Name</div>
                <div class="classmate-details">
                    <div class="cm-detail">
                        <span class="cm-label">Class</span>
                        <span class="cm-val" th:text="${s.className}">BCA-3</span>
                    </div>
                    <div class="cm-detail">
                        <span class="cm-label">Roll No</span>
                        <span class="cm-val" th:text="${s.rollNumber}">01</span>
                    </div>
                    <div class="cm-detail">
                        <span class="cm-label">Barcode</span>
                        <span class="cm-val" th:text="${s.barcode}">STU001</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- No results -->
        <div id="noResults" style="display:none;text-align:center;padding:40px;color:#94a3b8;">
            <div style="font-size:48px;margin-bottom:10px;">🔍</div>
            <p>No classmates found matching your search.</p>
        </div>
    </section>
</main>

<a href="/chatbot" class="chatbot-float" title="Ask Chatbot">🤖</a>

<script>
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('open');
    }

    function filterClassmates() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const cards = document.querySelectorAll('.classmate-card');
        let visibleCount = 0;

        cards.forEach(card => {
            const name = (card.dataset.name || '').toLowerCase();
            const roll = (card.dataset.roll || '').toLowerCase();

            if (query === '' || name.includes(query) || roll.includes(query)) {
                card.style.display = '';
                visibleCount++;
            } else {
                card.style.display = 'none';
            }
        });

        // Show/hide no-results
        document.getElementById('noResults').style.display = visibleCount === 0 ? 'block' : 'none';
        document.getElementById('searchCount').textContent = query ? visibleCount + ' found' : '';
    }
</script>
</body>
</html>
