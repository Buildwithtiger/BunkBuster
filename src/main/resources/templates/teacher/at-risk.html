<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>At Risk Students</title>
<link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="dashboard-wrapper">
    <aside class="sidebar">
        <div class="sidebar-brand">🎯 BunkBuster</div>
        <nav class="sidebar-menu">
            <a href="/teacher/dashboard">🏠 Dashboard</a>
            <a href="/teacher/students">👥 Students</a>
            <a href="/teacher/at-risk" class="active">⚠️ At Risk</a>
            <a href="/auth/logout" style="color:#ff6b6b;">🚪 Logout</a>
        </nav>
    </aside>
    <main class="main-content">
        <header class="topbar"><h1>⚠️ At-Risk Students</h1></header>
        <section class="section">
            <table class="data-table">
                <thead><tr><th>Name</th><th>Barcode</th><th>Class</th><th>Status</th></tr></thead>
                <tbody>
                <tr th:each="s : ${students}">
                    <td th:text="${s.name}">-</td>
                    <td th:text="${s.barcode}">-</td>
                    <td th:text="${s.className}">-</td>
                    <td>🟠 Needs attention</td>
                </tr>
                </tbody>
            </table>
        </section>
    </main>
</div>
</body>
</html>
