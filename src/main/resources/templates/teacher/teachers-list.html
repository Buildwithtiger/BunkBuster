<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Teachers</title>
<link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>

<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><span>🎯 BunkBuster</span>
        <button class="sidebar-close" onclick="toggleSidebar()">✕</button></div>
    <div class="drawer-profile" th:if="${teacher}">
        <div class="profile-photo-wrap">
            <img th:if="${teacher.profilePhoto != null}" th:src="${teacher.profilePhoto}" class="profile-photo">
            <div th:unless="${teacher.profilePhoto != null}" class="profile-photo default">
                <span th:text="${#strings.substring(teacher.name, 0, 1)}"></span>
            </div>
        </div>
        <div class="profile-name" th:text="${teacher.name}"></div>
        <div class="profile-roll"><span th:text="${teacher.subject}"></span> Teacher</div>
    </div>
    <nav class="sidebar-menu">
        <a href="/teacher/dashboard">🏠 Dashboard</a>
        <a href="/teacher/students">👥 Students</a>
        <a href="/teacher/students/add">➕ Add Student</a>
        <a href="/teacher/teachers-list" class="active">👨‍🏫 Teachers</a>
        <a href="/teacher/lectures">📅 Lectures</a>
        <a href="/teacher/reports">📊 Reports</a>
        <a href="/teacher/profile">👤 My Profile</a>
        <a href="/auth/logout" style="color:#ff6b6b;">🚪 Logout</a>
    </nav>
</aside>

<main class="main-content">
    <div th:replace="~{common/teacher-navbar :: navbar(${teacher})}"></div>

    <section class="section">
        <h2>👨‍🏫 All Teachers</h2>
        <div class="classmates-grid">
            <div class="classmate-card" th:each="t : ${teachers}">
                <div class="classmate-photo-wrap">
                    <img th:if="${t.profilePhoto != null}" th:src="${t.profilePhoto}" class="classmate-photo">
                    <div th:unless="${t.profilePhoto != null}" class="classmate-photo default">
                        <span th:text="${#strings.substring(t.name, 0, 1)}"></span>
                    </div>
                    <span th:if="${teacher != null and t.id == teacher.id}" class="me-tag">YOU</span>
                </div>
                <div class="classmate-name" th:text="${t.name}"></div>
                <div class="classmate-details">
                    <div class="cm-detail"><span class="cm-label">Subject</span><span class="cm-val" th:text="${t.subject}"></span></div>
                    <div class="cm-detail"><span class="cm-label">Email</span><span class="cm-val" th:text="${t.email}"></span></div>
                    <div class="cm-detail"><span class="cm-label">Phone</span><span class="cm-val" th:text="${t.phone}"></span></div>
                </div>
            </div>
        </div>
    </section>
</main>

<script>
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('open');
    }
</script>
</body>
</html>
