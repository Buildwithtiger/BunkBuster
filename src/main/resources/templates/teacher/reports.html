<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reports — BunkBuster</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <span>🎯 BunkBuster</span>
        <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
    </div>
    <div class="drawer-profile" th:if="${teacher}">
        <div class="profile-photo-wrap">
            <div class="profile-photo default">
                <span th:text="${#strings.substring(teacher.name, 0, 1)}">T</span>
            </div>
        </div>
        <div class="profile-name" th:text="${teacher.name}">Prof. Sharma</div>
        <div class="profile-roll">
            <span th:text="${teacher.subject}">Java</span> Teacher
        </div>
    </div>
    <nav class="sidebar-menu">
        <a href="/teacher/dashboard">🏠 Dashboard</a>
        <a href="/teacher/students">👥 Students</a>
        <a href="/teacher/students/add">➕ Add Student</a>
        <a href="/teacher/at-risk">⚠️ At Risk</a>
        <a href="/teacher/lectures">📅 Lectures</a>
        <a href="/teacher/reports" class="active">📊 Reports</a>
        <a href="/auth/logout" style="color:#ff6b6b;">🚪 Logout</a>
    </nav>
</aside>

<main class="main-content">
    <div th:replace="~{common/teacher-navbar :: navbar(${teacher})}"></div>

    <section class="section">
        <h2>📊 Reports</h2>
        <p style="color:#64748b;font-size:14px;">
            Reports module coming soon... (Attendance, Activity, At-Risk reports)
        </p>
    </section>
</main>

<script>
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('open');
    }
</script>
</body>
</html>
