<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Add Student</title>
<link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="dashboard-wrapper">
    <aside class="sidebar">
        <div class="sidebar-brand">🎯 BunkBuster</div>
        <nav class="sidebar-menu">
            <a href="/teacher/dashboard">🏠 Dashboard</a>
            <a href="/teacher/students">👥 Students</a>
            <a href="/teacher/students/add" class="active">➕ Add Student</a>
            <a href="/auth/logout" style="color:#ff6b6b;">🚪 Logout</a>
        </nav>
    </aside>
    <main class="main-content">
        <div th:replace="~{common/navbar :: navbar(${student})}"></div>
        <section class="section" style="max-width:600px;">
            <p th:if="${error}" class="error-text" th:text="${error}"></p>
            <form method="post" th:action="@{/teacher/students/add}">
                <label>Barcode *</label>
                <input type="text" name="barcode" required placeholder="STU010">
                <label>Name *</label>
                <input type="text" name="name" required>
                <label>Password *</label>
                <input type="text" name="password" required placeholder="pass123">
                <label>Email</label>
                <input type="email" name="email">
                <label>Phone</label>
                <input type="text" name="phone">
                <label>Parent Phone</label>
                <input type="text" name="parentPhone">
                <label>Gender</label>
                <select name="gender" style="width:100%;padding:12px;border:2px solid #ddd;border-radius:8px;">
                    <option value="M">Male</option>
                    <option value="F">Female</option>
                </select>
                <label>Class</label>
                <input type="text" name="className" placeholder="BCA-3">
                <label>Roll Number</label>
                <input type="text" name="rollNumber">
                <button type="submit">✅ Add Student</button>
            </form>
        </section>
    </main>
</div>
</body>
</html>
