<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Student — BunkBuster</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <span>🎯 BunkBuster</span>
        <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
    </div>
    <div class="drawer-profile" th:if="${teacher}">
        <div class="profile-photo-wrap">
            <div class="profile-photo default">
                <span th:text="${#strings.substring(teacher.name, 0, 1)}">T</span>
            </div>
        </div>
        <div class="profile-name" th:text="${teacher.name}">Prof. Sharma</div>
        <div class="profile-roll">
            <span th:text="${teacher.subject}">Java</span> Teacher
        </div>
    </div>
    <nav class="sidebar-menu">
        <a href="/teacher/dashboard">🏠 Dashboard</a>
        <a href="/teacher/students">👥 Students</a>
        <a href="/teacher/students/add" class="active">➕ Add Student</a>
        <a href="/teacher/at-risk">⚠️ At Risk</a>
        <a href="/teacher/lectures">📅 Lectures</a>
        <a href="/teacher/reports">📊 Reports</a>
        <a href="/auth/logout" style="color:#ff6b6b;">🚪 Logout</a>
    </nav>
</aside>

<main class="main-content">

    <div th:replace="~{common/teacher-navbar :: navbar(${teacher})}"></div>

    <div class="form-card">

        <div class="form-header">
            <div class="form-header-icon">➕</div>
            <div class="form-header-text">
                <h2>Add New Student</h2>
                <p>Fill in the details to register a new student</p>
            </div>
        </div>

        <p th:if="${error}" class="alert-error-box">
            <span>❌</span>
            <span th:text="${error}">Error</span>
        </p>

        <form method="post" th:action="@{/teacher/students/add}">

            <div class="form-grid">

                <div class="form-group">
                    <label>Barcode <span class="req">*</span></label>
                    <input type="text" name="barcode" required placeholder="STU010">
                </div>

                <div class="form-group">
                    <label>Full Name <span class="req">*</span></label>
                    <input type="text" name="name" required placeholder="Rahul Kumar">
                </div>

                <div class="form-group">
                    <label>Password <span class="req">*</span></label>
                    <input type="text" name="password" required placeholder="pass123">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="student@email.com">
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" name="phone" placeholder="9000000000">
                </div>

                <div class="form-group">
                    <label>Parent Phone</label>
                    <input type="text" name="parentPhone" placeholder="8000000000">
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender">
                        <option value="M">👦 Male</option>
                        <option value="F">👧 Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Class</label>
                    <input type="text" name="className" placeholder="BCA-3">
                </div>

                <div class="form-group">
                    <label>Roll Number</label>
                    <input type="text" name="rollNumber" placeholder="01">
                </div>

            </div>

            <div class="form-actions">
                <button type="submit" class="btn-save">✅ Add Student</button>
                <a href="/teacher/students" class="btn-cancel">✕ Cancel</a>
            </div>

        </form>

    </div>

</main>

<script>
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('open');
    }
</script>
</body>
</html>
