<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Leaderboard — BunkBuster</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <span>🎯 BunkBuster</span>
        <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
    </div>
    <div class="drawer-profile" th:if="${student}">
        <div class="profile-photo-wrap">
            <img th:if="${student.profilePhoto != null}" th:src="${student.profilePhoto}" class="profile-photo">
            <div th:unless="${student.profilePhoto != null}" class="profile-photo default">
                <span th:text="${#strings.substring(student.name, 0, 1)}">R</span>
            </div>
            <form th:action="@{/student/upload-photo}" method="post" enctype="multipart/form-data" class="photo-form">
                <label for="photoInput" class="photo-edit-btn">📷</label>
                <input type="file" id="photoInput" name="photo" accept="image/*" onchange="this.form.submit()" style="display:none;">
            </form>
        </div>
        <div class="profile-name" th:text="${student.name}">Student</div>
        <div class="profile-roll">
            <span th:text="${student.className}">BCA-3</span> · Roll <span th:text="${student.rollNumber}">01</span>
        </div>
    </div>
    <nav class="sidebar-menu">
        <a href="/student/home">🏠 Dashboard</a>
        <a href="/student/subjects">📚 Subjects</a>
        <a href="/student/mark-attendance">✅ Mark Attendance</a>
        <a href="/student/leaderboard" class="active">🏆 Leaderboard</a>
        <a href="/student/classmates">👥 Classmates</a>
        <a href="/student/profile">👤 Profile</a>
        <a href="/auth/logout" style="color:#ff6b6b;">🚪 Logout</a>
    </nav>
</aside>

<main class="main-content">
    <div th:replace="~{common/navbar :: navbar(${student})}"></div>

    <section class="section">
        <h2>🏆 Class Leaderboard — <span th:text="${student.className}">BCA-3</span></h2>
        <p style="color:#64748b;font-size:14px;margin-bottom:15px;">
            Class ke top performers (attendance + activity score)
        </p>

        <div class="leaderboard-list">
            <div class="lb-row" th:each="s, iter : ${students}"
                 th:classappend="${s.id == student.id} ? 'me' : ''">
                <div class="lb-rank"
                     th:classappend="${iter.index == 0} ? 'gold' : (${iter.index == 1} ? 'silver' : (${iter.index == 2} ? 'bronze' : ''))"
                     th:text="${iter.index + 1}">1</div>
                <div class="lb-photo-wrap">
                    <img th:if="${s.profilePhoto != null}" th:src="${s.profilePhoto}" class="lb-photo">
                    <div th:unless="${s.profilePhoto != null}" class="lb-photo default">
                        <span th:text="${#strings.substring(s.name, 0, 1)}">R</span>
                    </div>
                </div>
                <div class="lb-info">
                    <div class="lb-name">
                        <span th:text="${s.name}">Name</span>
                        <span th:if="${s.id == student.id}" class="you-badge">YOU</span>
                    </div>
                    <div class="lb-detail">
                        Roll <span th:text="${s.rollNumber}">01</span> · <span th:text="${s.className}">BCA-3</span>
                    </div>
                </div>
                <div class="lb-score">
                    <div class="lb-percent" th:text="${95 - iter.index * 3} + '%'">95%</div>
                    <div class="lb-bar">
                        <div class="lb-bar-fill" th:style="'width:' + (95 - iter.index * 3) + '%'"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<a href="/chatbot" class="chatbot-float" title="Ask Chatbot">🤖</a>

<script>
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('open');
    }
</script>
</body>
</html>
